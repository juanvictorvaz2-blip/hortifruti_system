{% extends 'base.html' %} <!-- Ou o cabeçalho Bootstrap padrão do projeto -->

{% block content %}
<div class="container my-5" style="max-width: 400px;">
    <div class="card shadow-sm border-0">
        <div class="card-body p-4">
            <h3 class="card-title text-center mb-4 text-success fw-bold">Hortifrúti Estoque</h3>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Usuário</label>
                    <input type="text" name="username" class="form-control" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label">Senha</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-success w-100 fw-bold py-2">Entrar</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
